services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: migrasi
      POSTGRES_USER: migrasi
      POSTGRES_PASSWORD: migrasi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    image: python:3.14-slim
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./web:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: migrasi
      POSTGRES_USER: migrasi
      POSTGRES_PASSWORD: migrasi
      POSTGRES_HOST: db
    depends_on:
      - db

volumes:
  pgdata:
